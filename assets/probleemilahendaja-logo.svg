<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Probleemilahendaja logo</title>
  <desc id="logoDesc">Abstraktne märk, kus mitu lähtepunkti koonduvad üheks selgeks lahenduseks.</desc>
  <defs>
    <linearGradient id="logoBg" x1="18" y1="14" x2="112" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2d42"/>
      <stop offset="0.56" stop-color="#35586a"/>
      <stop offset="1" stop-color="#7aa094"/>
    </linearGradient>
    <linearGradient id="logoStroke" x1="31" y1="31" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#eef5f1"/>
    </linearGradient>
    <linearGradient id="logoResolve" x1="66" y1="64" x2="99" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0d7a6"/>
      <stop offset="1" stop-color="#d4ae67"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#111d2d" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#logoShadow)">
    <rect x="12" y="12" width="104" height="104" rx="29" fill="url(#logoBg)"/>
    <rect x="16" y="16" width="96" height="96" rx="25" fill="none" stroke="#f8f3e9" stroke-opacity="0.14"/>
  </g>
  <circle cx="34" cy="40" r="5" fill="#f7f3ea"/>
  <circle cx="34" cy="64" r="5" fill="#f7f3ea"/>
  <circle cx="34" cy="88" r="5" fill="#f7f3ea"/>
  <path
    d="M42 40C53 40 58 50 64 64"
    fill="none"
    stroke="url(#logoStroke)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M42 64H64"
    fill="none"
    stroke="url(#logoStroke)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M42 88C53 88 58 78 64 64"
    fill="none"
    stroke="url(#logoStroke)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M64 64H86"
    fill="none"
    stroke="url(#logoResolve)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="94" cy="64" r="6" fill="#f1dab0"/>
</svg>
